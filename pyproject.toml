[project]
name = "python-dq-application"
version = "0.1.0"
description = "Desktop Data Quality application with Tkinter and local SQLite history"
requires-python = ">=3.14"
dependencies = [
    "bcrypt==5.0.0",
    "matplotlib>=3.10,<4",
    "pandas==2.3.3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pillow>=11"]
migration = ["mysql-connector-python==9.5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["gui: opens real Tkinter windows with a temporary SQLite database (requires a desktop)"]
